services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
      # DATABASE_URL, OWNER_TOKEN, MISTRAL_API_KEY: the data lives in
      # Postgres, not in the container.
    volumes:
      # Named volume: the ChromaDB index survives `docker compose down`
      # instead of being rebuilt at every start (see docker/entrypoint.sh).
      - job-agent-chroma:/app/scoring/embeddings/chroma

volumes:
  job-agent-chroma:
