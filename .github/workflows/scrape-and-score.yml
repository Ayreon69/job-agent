name: Scrape and score job offers

# Runs the existing pipeline as-is (no new decision logic here): scraper
# (session 1) -> stale-offer cleanup -> orchestrator batch mode (session 5).
# Never submits a candidacy — see CLAUDE.md "Ce que l'agent ne doit jamais
# faire".
#
# Direct Python execution rather than the session-7 Docker image: GitHub's
# hosted runners already give a clean Python 3.11 environment per job, so
# building/pulling the ~6.6GB image would only add time.
#
# Persistence (session 20): every step reads and writes the Postgres
# database (Neon) at DATABASE_URL, and each offer is stored as soon as it's
# processed. Nothing is committed back to the repo any more — until then
# storage/jobs.db was, after every stage, which grew the git history with
# every run and still left the analyses on the runner. A run killed by a
# timeout now loses at most the offer in progress.
#
# scoring/embeddings/chroma/ (the ChromaDB vector index) is not persisted:
# it's rebuilt from scoring/profile/*.md at the start of every run (a few
# seconds, and identical to what a committed copy would hold).

on:
  schedule:
    # Daily at 06:00 UTC (~08:00 Europe/Paris). GitHub starts scheduled
    # runs late when its runners are busy — several hours, observed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
    # Manual trigger for testing without waiting for the cron, and for
    # on-demand runs between scheduled ones.

permissions:
  contents: read

concurrency:
  group: scrape-and-score
  cancel-in-progress: false
    # Never cancel a mid-flight run to start another: two runs would score
    # the same 'nouveau' offers twice. Queue instead.

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 105
      # Caps a hang rather than letting a stuck job burn the Actions minutes
      # budget. Scraping takes ~10-15 min (LinkedIn's paced detail pages
      # included), the orchestrator step has its own tighter timeout below
      # so cleanup and backfill still get to run.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check database secret
        run: test -n "$DATABASE_URL" || { echo "Secret DATABASE_URL manquant"; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: docker/requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Same locked dependency set as the Docker image (session 7), for
          # the same reason: requirements.txt alone is unpinned, and a fresh
          # resolve could land on a different opentelemetry-semantic-conventions
          # version than the one known to work (see ROADMAP.md session 3).
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r docker/requirements-lock.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore personal profile from secret (never committed)
        # scoring/profile/*.md is personal (CV-level detail) and gitignored.
        # JOB_AGENT_PROFILE holds a base64 tar.gz of that folder; it is
        # unpacked on the throwaway runner only.
        env:
          JOB_AGENT_PROFILE: ${{ secrets.JOB_AGENT_PROFILE }}
        run: |
          test -n "$JOB_AGENT_PROFILE" || { echo "Secret JOB_AGENT_PROFILE manquant"; exit 1; }
          mkdir -p scoring/profile
          echo "$JOB_AGENT_PROFILE" | base64 -d | tar -xz -C scoring/profile

      - name: Build ChromaDB profile index
        run: python -m scoring.embeddings.build

      - name: Run scraper (Hellowork + jobup.ch + LinkedIn, default queries/regions)
        # --source defaults to "all" (scraper/run.py): Hellowork covers
        # Rhone-Alpes, jobup.ch Suisse romande (session 11), LinkedIn
        # Suisse romande + UAE (session 19). LinkedIn runs last and is
        # isolated: if it refuses the runner's IP, the step still succeeds
        # with the other two sources. Also refreshes last_seen_at for every
        # already-known offer this run still finds — the signal the next
        # step's cleanup relies on, so it must run before it.
        run: python -m scraper.run

      - name: Delete stale offers (not seen in any scrape for 30+ days)
        # Runs right after scraping so last_seen_at is fresh for this run.
        # No verdict protection (explicit user decision, 2026-08-20): an
        # offer marked "interessante" is deleted like any other once stale.
        # See storage/cleanup.py for why last_seen_at, not published_at.
        run: python -m storage.cleanup --days 30

      - name: Run orchestrator batch (status='nouveau')
        # Each offer's score, status and analysis are stored as soon as it's
        # processed; --max-minutes stops starting new offers once the budget
        # is spent (an offer takes ~45 s, a few minutes at worst with a
        # re-scrape or 429 backoffs), so the step ends cleanly before its
        # timeout and the next run picks up the queue.
        timeout-minutes: 55
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m orchestrator.run --max-minutes 50

      - name: Backfill scores missing from the database (scoring only, capped)
        timeout-minutes: 15
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m orchestrator.run --missing-scores --scoring-only --limit 40
